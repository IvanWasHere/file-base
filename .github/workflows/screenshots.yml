# Regenerates the screenshots and opens a pull request with them.
#
# Run it by hand (Actions → Screenshots → Run workflow) after a UI change. It
# drives the frontend against the mock bridge with Playwright — see
# docs/site/scripts/capture.mjs — so every image shows the same fake /Users/dev
# and nothing private. Merging the pull request then republishes the site
# through pages.yml.
#
# macOS rather than Linux so fonts render the way they do on a Mac, and because
# the script scales with `sips`.
#
# One-time setup for the pull request step: Settings → Actions → General →
# Workflow permissions → "Allow GitHub Actions to create and approve pull
# requests".

name: Screenshots

on:
  workflow_dispatch:
    inputs:
      set:
        description: Which screenshots to regenerate
        type: choice
        options: [all, guide, readme]
        default: all

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start the app against the mock bridge
        working-directory: frontend
        run: |
          nohup npm run dev:mock -- --port 5199 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          for _ in $(seq 60); do
            curl -sf http://localhost:5199/ > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/vite.log"
          exit 1

      - name: Install Playwright
        working-directory: docs/site/scripts
        run: |
          npm i --no-save playwright
          npx playwright install chromium

      - name: Guide screenshots
        if: inputs.set != 'readme'
        working-directory: docs/site/scripts
        run: node capture.mjs | tee "$RUNNER_TEMP/guide.log"

      - name: README screenshots
        if: inputs.set != 'guide'
        working-directory: docs/site/scripts
        run: |
          node capture.mjs readme | tee "$RUNNER_TEMP/readme.log"
          # The website shows the README images too, a little smaller.
          for i in 1 2 3 4; do
            sips -Z 1600 "../../screenshots/screen$i.png" --out "../assets/img/showcase/screen$i.png" > /dev/null
          done

      # capture.mjs reports a failed scene and carries on, so a missing button
      # would otherwise leave a stale image in place without failing the run.
      - name: Fail on any failed scene
        run: |
          if grep -h '^FAIL' "$RUNNER_TEMP"/guide.log "$RUNNER_TEMP"/readme.log 2>/dev/null; then
            exit 1
          fi

      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-scenes
          path: docs/site/scripts/raw/*-FAIL.png
          if-no-files-found: ignore

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: screenshots/regenerate
          delete-branch: true
          commit-message: Regenerate screenshots (${{ inputs.set }})
          title: Regenerate screenshots (${{ inputs.set }})
          body: |
            Screenshots regenerated by the **Screenshots** workflow from `${{ github.sha }}`
            against the mock bridge. Set: `${{ inputs.set }}`.

            Review the images in *Files changed*, then merge to republish the site.
          add-paths: |
            docs/screenshots/*.png
            docs/site/assets/img/guide/*.png
            docs/site/assets/img/showcase/*.png
