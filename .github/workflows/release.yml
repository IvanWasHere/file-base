# Builds File Base and attaches it to a GitHub release (PLAN.md §M12).
#
# Triggered by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
# `workflow_dispatch` runs the same build without publishing, which is how to
# check the pipeline works before spending a tag on it.
#
# Signing is **optional and gated on secrets**. With none set the app is
# ad-hoc signed by `wails build`, which runs fine on the machine that built it
# and is stopped by Gatekeeper on anyone else's — see docs/RELEASING.md for what
# that looks like and how to add the four secrets that fix it. Every signing
# step below is skipped rather than failed when they are absent, so this
# workflow works on day one and upgrades itself the moment the secrets exist.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # A macOS runner is not optional: `wails build` links against WebKit, and
    # the universal binary needs the macOS SDK for both architectures.
    runs-on: macos-latest

    # Lifted to `env` because **`secrets` is not one of the contexts allowed in
    # an `if`** — only `env` is. Reading them here is what lets each signing step
    # below skip itself when the repository has no certificate configured.
    # Values are still masked in the log.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      # The version the app reports comes from the tag. Anything else means a
      # download whose About panel disagrees with the release it came from.
      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev+${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION}"

      - uses: actions/setup-go@v5
        with:
          # From go.mod, so the CI toolchain cannot drift from the one the
          # module declares.
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Pinned to the version in go.mod. `@latest` would mean a Wails release
      # could break a tagged build of an unchanged commit.
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # A release must not ship a red build. This is the same suite that runs
      # locally: ~640 frontend tests against the mock bridge, plus the Go side.
      - name: Test
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend run lint
          npm --prefix frontend test
          go vet ./...
          go test ./backend/...

      # CFBundleVersion and CFBundleShortVersionString come from this field
      # (see build/darwin/Info.plist), so the tag ends up in Get Info and in the
      # About panel.
      - name: Stamp the version into wails.json
        run: |
          jq --arg v '${{ steps.version.outputs.version }}' \
            '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json

      - name: Build
        run: wails build -platform darwin/universal -clean

      # ---- Signing. Every step here is skipped when the secrets are absent. ----

      - name: Import the signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          CERTIFICATE: ${{ env.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ env.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # A throwaway keychain, unlocked for this job only. Importing into the
          # runner's login keychain would leave the key readable by later steps.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"

          # Without this, codesign blocks on a GUI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

      - name: Sign
        if: env.MACOS_CERTIFICATE != ''
        env:
          IDENTITY: ${{ env.MACOS_SIGNING_IDENTITY }}
        run: |
          # `--options runtime` is the hardened runtime, which notarization
          # requires; `--deep` covers the frameworks inside the bundle.
          codesign --force --deep --timestamp --options runtime \
            --sign "$IDENTITY" build/bin/file-base.app
          codesign --verify --strict --verbose=2 build/bin/file-base.app

      # Zipped with ditto, not `zip`: a .app is a directory of symlinks and
      # permission bits, and `zip` flattens both. `--keepParent` keeps the
      # bundle as the top-level entry so it unzips as an app, not as loose
      # Contents/.
      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/bin/file-base.app \
            "build/bin/FileBase-${{ steps.version.outputs.version }}-universal.zip"

      # Notarizing the *zip* rather than the app: Apple's service takes an
      # archive, and stapling afterwards writes the ticket into the .app — which
      # is why the zip is rebuilt below.
      - name: Notarize
        if: env.MACOS_NOTARY_APPLE_ID != ''
        env:
          APPLE_ID: ${{ env.MACOS_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ env.MACOS_NOTARY_PASSWORD }}
          TEAM_ID: ${{ env.MACOS_NOTARY_TEAM_ID }}
          ZIP: build/bin/FileBase-${{ steps.version.outputs.version }}-universal.zip
        run: |
          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait --timeout 30m
          # Stapling means the app opens on a machine that is offline, rather
          # than depending on a Gatekeeper round trip at first launch.
          xcrun stapler staple build/bin/file-base.app
          rm "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent build/bin/file-base.app "$ZIP"

      - name: Verify what will be published
        run: |
          echo "--- signature ---"
          codesign -dv --verbose=4 build/bin/file-base.app 2>&1 || true
          echo "--- Gatekeeper assessment ---"
          # Fails loudly for an unsigned build, which is expected and not fatal:
          # it is the one place the log says plainly what a user will hit.
          spctl -a -vv -t exec build/bin/file-base.app 2>&1 || true
          echo "--- architectures ---"
          lipo -archs build/bin/file-base.app/Contents/MacOS/file-base

      - uses: actions/upload-artifact@v4
        with:
          name: FileBase-${{ steps.version.outputs.version }}-universal
          path: build/bin/*.zip
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/*.zip
          generate_release_notes: true
          draft: true
          body: |
            ## File Base ${{ steps.version.outputs.version }}

            **Requires macOS 10.13 or later.** Universal — Apple silicon and Intel.

            Download the zip, unzip it, and drag **file-base.app** to
            Applications.
