# Builds File Base and attaches it to a GitHub release (PLAN.md §M12).
#
# Triggered by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
# `workflow_dispatch` runs the same build without publishing, which is how to
# check the pipeline works before spending a tag on it.
#
# **There is no code signing here, on purpose.** Signing needs an Apple
# Developer Program membership (99 USD/year), and this project does not have one.
# `wails build` ad-hoc signs, which identifies nobody: the app runs on the
# machine that built it and Gatekeeper stops it on everyone else's, so each
# downloader clears it once through System Settings → Privacy & Security. The
# release notes say so. docs/RELEASING.md records what adding signing would take
# if that ever changes.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # A macOS runner is not optional: `wails build` links against WebKit, and
    # the universal binary needs the macOS SDK for both architectures.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # The version the app reports comes from the tag. Anything else means a
      # download whose About panel disagrees with the release it came from.
      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev+${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION}"

      - uses: actions/setup-go@v5
        with:
          # From go.mod, so the CI toolchain cannot drift from the one the
          # module declares.
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Pinned to the version in go.mod. `@latest` would mean a Wails release
      # could break a tagged build of an unchanged commit.
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # A release must not ship a red build. This is the same suite that runs
      # locally: ~650 frontend tests against the mock bridge, plus the Go side.
      #
      # **Order matters, and cost a release to learn.** `main.go` carries
      # `//go:embed all:frontend/dist`, and `frontend/dist` is gitignored — so on
      # a fresh checkout it does not exist and *any* Go command covering the root
      # package fails with "pattern all:frontend/dist: no matching files found".
      # It passed locally because a previous build had left a dist behind.
      # Building the frontend first is what makes `go vet ./...` compile; it also
      # proves the production bundle builds before the Go side is touched, and
      # `npm run build` runs typecheck itself.
      - name: Test
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend test
          npm --prefix frontend run build
          go vet ./...
          go test ./backend/...

      # CFBundleVersion and CFBundleShortVersionString come from this field
      # (see build/darwin/Info.plist), so the tag ends up in Get Info and in the
      # About panel.
      - name: Stamp the version into wails.json
        run: |
          jq --arg v '${{ steps.version.outputs.version }}' \
            '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json

      - name: Build
        run: wails build -platform darwin/universal -clean

      # Zipped with ditto, not `zip`: a .app is a directory of symlinks and
      # permission bits, and `zip` flattens both. `--keepParent` keeps the
      # bundle as the top-level entry so it unzips as an app, not as loose
      # Contents/.
      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/bin/file-base.app \
            "build/bin/FileBase-${{ steps.version.outputs.version }}-universal.zip"

      # The download most people want: mount it, drag the app onto the
      # Applications shortcut beside it, done.
      #
      # Plain `hdiutil`, not `create-dmg`: this needs no dependency and no
      # Finder-scripted window layout, which is the part that goes flaky on a
      # headless runner. The trade is a plain window rather than a designed one.
      - name: Build the disk image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R build/bin/file-base.app "$STAGE/"
          # The half of "drag to install" that people actually drag onto.
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "File Base" -srcfolder "$STAGE" \
            -ov -format UDZO "build/bin/FileBase-${VERSION}.dmg"

      - name: Verify what will be published
        run: |
          # Kept even though nothing here signs: `adhoc` and `rejected` are the
          # expected answers, and printing them each run is what stops the
          # unsigned state from being a surprise later. Neither fails the build.
          echo "--- signature (expect: adhoc) ---"
          codesign -dv --verbose=4 build/bin/file-base.app 2>&1 || true
          echo "--- Gatekeeper assessment (expect: rejected) ---"
          spctl -a -vv -t exec build/bin/file-base.app 2>&1 || true
          echo "--- architectures ---"
          lipo -archs build/bin/file-base.app/Contents/MacOS/file-base
          echo "--- what will be attached ---"
          ls -lh build/bin/*.zip build/bin/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: FileBase-${{ steps.version.outputs.version }}-universal
          path: |
            build/bin/*.zip
            build/bin/*.dmg
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/*.dmg
            build/bin/*.zip
          generate_release_notes: true
          draft: true
          body: |
            ## File Base ${{ steps.version.outputs.version }}

            **Requires macOS 10.13 or later.** Universal — Apple silicon and Intel.

            **Download `FileBase-${{ steps.version.outputs.version }}.dmg`**, open
            it, and drag **file-base.app** onto the Applications shortcut. The
            `.zip` is the same app if you prefer it.

            The app is not signed yet, so macOS blocks the first launch. It is
            intact — it just has no Developer ID.

            - **macOS 15 and later:** double-click it, dismiss the warning, then
              open **System Settings → Privacy & Security**, scroll to the
              bottom, and click **Open Anyway**. Once per version.
            - **macOS 14 and earlier:** right-click it → **Open** → **Open**.
