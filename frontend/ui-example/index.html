<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault - File Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Space Grotesk"', 'sans-serif'],
                        body: ['"IBM Plex Sans"', 'sans-serif'],
                    }
                }
            }
        }

    <style>
        :root {
            --bg-deep: #0e0e12;
            --bg-base: #141419;
            --bg-surface: #1a1a22;
            --bg-elevated: #22222e;
            --bg-hover: #2a2a38;
            --bg-active: #32324a;
            --border: #2c2c3c;
            --border-focus: #e8a830;
            --text-primary: #e2e2ea;
            --text-secondary: #8a8a9e;
            --text-muted: #5a5a72;
            --accent: #e8a830;
            --accent-dim: #c48820;
            --accent-glow: rgba(232, 168, 48, 0.12);
            --danger: #e84848;
            --success: #38c868;
            --info: #48a8e8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--bg-deep); color: var(--text-primary);
            overflow: hidden; height: 100vh; user-select: none;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .tab-bar {
            display: flex; align-items: flex-end; background: var(--bg-deep);
            border-bottom: 1px solid var(--border); padding: 0 8px; height: 40px; gap: 2px;
        }
        .tab-item {
            display: flex; align-items: center; gap: 6px; padding: 6px 14px; font-size: 12px;
            font-weight: 500; color: var(--text-secondary); background: var(--bg-surface);
            border: 1px solid var(--border); border-bottom: none; border-radius: 8px 8px 0 0;
            cursor: pointer; max-width: 180px; min-width: 80px; transition: all 0.15s ease;
            position: relative; top: 1px;
        }
        .tab-item:hover { background: var(--bg-elevated); color: var(--text-primary); }
        .tab-item.active { background: var(--bg-surface); color: var(--accent); border-color: var(--accent); border-bottom: 1px solid var(--bg-surface); z-index: 2; }
        .tab-item .tab-close {
            display: flex; align-items: center; justify-content: center; width: 16px; height: 16px;
            border-radius: 4px; font-size: 10px; opacity: 0; transition: all 0.1s; margin-left: auto; flex-shrink: 0;
        }
        .tab-item:hover .tab-close { opacity: 0.6; }
        .tab-item .tab-close:hover { opacity: 1; background: var(--bg-hover); }
        .tab-item .tab-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tab-new {
            display: flex; align-items: center; justify-content: center; width: 28px; height: 28px;
            border-radius: 6px; color: var(--text-muted); cursor: pointer; margin-left: 4px;
            margin-bottom: 4px; transition: all 0.15s; font-size: 14px;
        }
        .tab-new:hover { background: var(--bg-elevated); color: var(--text-primary); }

        .toolbar {
            display: flex; align-items: center; gap: 8px; padding: 8px 12px;
            background: var(--bg-surface); border-bottom: 1px solid var(--border);
        }
        .toolbar-btn {
            display: flex; align-items: center; justify-content: center; width: 32px; height: 32px;
            border-radius: 6px; color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
            border: none; background: none; font-size: 14px;
        }
        .toolbar-btn:hover:not(:disabled) { background: var(--bg-hover); color: var(--text-primary); }
        .toolbar-btn:disabled { opacity: 0.3; cursor: default; }
        .toolbar-btn.active { background: var(--accent-glow); color: var(--accent); }

        .split-group {
            display: flex; gap: 2px; background: var(--bg-base);
            border: 1px solid var(--border); border-radius: 6px; padding: 2px;
        }
        .split-btn {
            display: flex; align-items: center; justify-content: center; width: 30px; height: 26px;
            border-radius: 4px; color: var(--text-muted); cursor: pointer; transition: all 0.15s;
            border: none; background: none; font-size: 14px;
        }
        .split-btn:hover { color: var(--text-primary); background: var(--bg-hover); }
        .split-btn.active { color: var(--accent); background: var(--accent-glow); }

        .view-dropdown { position: relative; }
        .view-dropdown-btn {
            display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 6px;
            background: var(--bg-base); border: 1px solid var(--border); color: var(--text-primary);
            font-size: 12px; font-family: inherit; cursor: pointer; transition: border-color 0.15s;
        }
        .view-dropdown-btn:hover { border-color: var(--text-muted); }
        .view-dropdown-btn i.fa-chevron-down { font-size: 10px; color: var(--text-muted); }
        .view-dropdown-btn.active-view { border-color: var(--accent); }

        .view-menu {
            position: absolute; top: 100%; left: 0; margin-top: 4px; background: var(--bg-elevated);
            border: 1px solid var(--border); border-radius: 8px; padding: 4px; min-width: 180px;
            z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.4); display: none;
        }
        .view-menu.open { display: block; }
        .view-menu-item {
            display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px;
            font-size: 13px; color: var(--text-secondary); cursor: pointer; transition: all 0.12s;
        }
        .view-menu-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .view-menu-item.active { color: var(--accent); background: var(--accent-glow); }
        .view-menu-item i { width: 18px; text-align: center; font-size: 14px; }

        .breadcrumb {
            display: flex; align-items: center; gap: 2px; padding: 4px 10px; background: var(--bg-base);
            border: 1px solid var(--border); border-radius: 6px; flex: 1; min-width: 0;
            overflow: hidden; font-size: 13px;
        }
        .breadcrumb-segment {
            color: var(--text-secondary); cursor: pointer; padding: 2px 4px; border-radius: 3px;
            white-space: nowrap; transition: all 0.1s;
        }
        .breadcrumb-segment:hover { color: var(--accent); background: var(--accent-glow); }
        .breadcrumb-segment:last-child { color: var(--text-primary); font-weight: 500; }
        .breadcrumb-sep { color: var(--text-muted); font-size: 10px; }

        .main-layout { display: flex; height: calc(100vh - 40px - 49px - 28px); }

        .sidebar {
            width: 220px; min-width: 220px; background: var(--bg-base);
            border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 0;
            display: flex; flex-direction: column; gap: 4px;
        }
        .sidebar-section { padding: 0 12px; margin-bottom: 8px; }
        .sidebar-title {
            font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); padding: 4px 0 8px;
        }
        .sidebar-item {
            display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px;
            cursor: pointer; font-size: 13px; color: var(--text-secondary); transition: all 0.12s;
        }
        .sidebar-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .sidebar-item.active { background: var(--accent-glow); color: var(--accent); }
        .sidebar-item .sidebar-icon { width: 18px; text-align: center; font-size: 13px; }
        .sidebar-item .sidebar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sidebar-item .sidebar-size { margin-left: auto; font-size: 10px; color: var(--text-muted); }

        .file-panels-container { flex: 1; display: flex; overflow: hidden; }
        .file-panel {
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
            border-right: 1px solid var(--border); position: relative;
        }
        .file-panel:last-child { border-right: none; }
        .file-panel-header {
            display: flex; align-items: center; padding: 4px 10px; background: var(--bg-elevated);
            border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-muted); gap: 8px;
        }
        .panel-letter {
            font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 12px; color: var(--accent);
            width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
            background: var(--accent-glow); border-radius: 4px;
        }
        .panel-breadcrumb { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; overflow: hidden; }
        .panel-breadcrumb span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-secondary); cursor: pointer; }
        .panel-breadcrumb span:hover { color: var(--accent); }
        .panel-breadcrumb .sep { color: var(--text-muted); cursor: default; }

        .file-grid-area {
            flex: 1; overflow: auto; padding: 8px;
            background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.015) 1px, transparent 0);
            background-size: 24px 24px;
        }

        .detail-header {
            display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 0; padding: 6px 12px;
            font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 0.5px; border-bottom: 1px solid var(--border); position: sticky; top: 0;
            background: var(--bg-surface); z-index: 1;
        }
        .detail-row {
            display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 0; padding: 8px 12px;
            font-size: 13px; cursor: pointer; border-bottom: 1px solid rgba(44,44,60,0.4);
            transition: all 0.1s; align-items: center;
        }
        .detail-row:hover { background: var(--bg-hover); }
        .detail-row.selected { background: var(--accent-glow); }
        .detail-row .name-cell { display: flex; align-items: center; gap: 8px; overflow: hidden; }
        .detail-row .name-cell span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .detail-row .size-cell, .detail-row .date-cell, .detail-row .type-cell { color: var(--text-secondary); font-size: 12px; }

        .icons-large-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; padding: 8px; }
        .icon-large-item {
            display: flex; flex-direction: column; align-items: center; padding: 12px 8px 8px;
            border-radius: 8px; cursor: pointer; transition: all 0.12s; gap: 6px;
        }
        .icon-large-item:hover { background: var(--bg-hover); }
        .icon-large-item.selected { background: var(--accent-glow); }
        .icon-large-item .icon-img { width: 56px; height: 56px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        .icon-large-item .icon-label { font-size: 11px; text-align: center; word-break: break-word; line-height: 1.3; max-width: 90px; color: var(--text-secondary); }
        .icon-large-item.selected .icon-label { color: var(--accent); }

        .icons-medium-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; padding: 8px; }
        .icon-medium-item {
            display: flex; flex-direction: column; align-items: center; padding: 8px 6px 6px;
            border-radius: 6px; cursor: pointer; transition: all 0.12s; gap: 4px;
        }
        .icon-medium-item:hover { background: var(--bg-hover); }
        .icon-medium-item.selected { background: var(--accent-glow); }
        .icon-medium-item .icon-img { width: 40px; height: 40px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .icon-medium-item .icon-label { font-size: 10px; text-align: center; word-break: break-word; line-height: 1.2; max-width: 72px; color: var(--text-secondary); }
        .icon-medium-item.selected .icon-label { color: var(--accent); }

        .icons-small-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 2px; padding: 4px; }
        .icon-small-item {
            display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 4px;
            cursor: pointer; transition: all 0.1s;
        }
        .icon-small-item:hover { background: var(--bg-hover); }
        .icon-small-item.selected { background: var(--accent-glow); }
        .icon-small-item .icon-img { width: 22px; height: 22px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
        .icon-small-item .icon-label { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
        .icon-small-item.selected .icon-label { color: var(--accent); }

        .preview-panel {
            width: 0; min-width: 0; background: var(--bg-base); border-left: 1px solid var(--border);
            overflow: hidden; transition: width 0.25s ease, min-width 0.25s ease; display: flex; flex-direction: column;
        }
        .preview-panel.open { width: 280px; min-width: 280px; }
        .preview-header {
            display: flex; align-items: center; justify-content: space-between; padding: 10px 12px;
            border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--text-secondary);
        }
        .preview-close {
            width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
            border-radius: 4px; cursor: pointer; color: var(--text-muted); transition: all 0.1s;
        }
        .preview-close:hover { background: var(--bg-hover); color: var(--text-primary); }
        .preview-body { flex: 1; overflow-y: auto; padding: 16px; }
        .preview-icon-area { display: flex; align-items: center; justify-content: center; height: 120px; margin-bottom: 16px; border-radius: 8px; background: var(--bg-surface); }
        .preview-icon-area i { font-size: 48px; }
        .preview-info-row {
            display: flex; justify-content: space-between; padding: 6px 0;
            border-bottom: 1px solid rgba(44,44,60,0.3); font-size: 12px;
        }
        .preview-info-row .label { color: var(--text-muted); }
        .preview-info-row .value { color: var(--text-primary); font-weight: 500; }
        .preview-content-area {
            margin-top: 12px; padding: 10px; background: var(--bg-surface); border-radius: 6px;
            font-size: 12px; color: var(--text-secondary); line-height: 1.6; max-height: 200px;
            overflow-y: auto; white-space: pre-wrap; word-break: break-word;
        }

        .status-bar {
            display: flex; align-items: center; justify-content: space-between; padding: 0 14px;
            height: 28px; background: var(--bg-surface); border-top: 1px solid var(--border);
            font-size: 11px; color: var(--text-muted);
        }
        .status-bar .status-left { display: flex; gap: 16px; }
        .status-bar .status-right { display: flex; gap: 16px; align-items: center; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); display: inline-block; margin-right: 4px; }

        .ft-folder { color: #e8a830; } .ft-image { color: #e86898; } .ft-document { color: #4898e8; }
        .ft-code { color: #38c868; } .ft-music { color: #c848e8; } .ft-video { color: #e85848; }
        .ft-archive { color: #e89848; } .ft-data { color: #48c8c8; } .ft-default { color: var(--text-muted); }

        .ft-bg-folder { background: rgba(232,168,48,0.12); } .ft-bg-image { background: rgba(232,104,152,0.12); }
        .ft-bg-document { background: rgba(72,152,232,0.12); } .ft-bg-code { background: rgba(56,200,104,0.12); }
        .ft-bg-music { background: rgba(200,72,232,0.12); } .ft-bg-video { background: rgba(232,88,72,0.12); }
        .ft-bg-archive { background: rgba(232,152,72,0.12); } .ft-bg-data { background: rgba(72,200,200,0.12); }
        .ft-bg-default { background: rgba(90,90,114,0.12); }

        .split-handle { width: 4px; cursor: col-resize; background: var(--border); transition: background 0.15s; flex-shrink: 0; }
        .split-handle:hover { background: var(--accent); }

        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); gap: 8px; }
        .empty-state i { font-size: 36px; opacity: 0.4; }
        .empty-state span { font-size: 13px; }

        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
    </style>
</head>

            const file = state.previewFile; if (!file) return m('.preview-panel');

            const infoRows = [ m('.preview-info-row', { key: 'type' }, [ m('span.label', 'Type'), m('span.value', getTypeLabel(file)) ]), m('.preview-info-row', { key: 'size' }, [ m('span.label', 'Size'), m('span.value', formatSize(file.size)) ]), m('.preview-info-row', { key: 'modified' }, [ m('span.label', 'Modified'), m('span.value', formatDate(file.modified)) ]) ];
            if (file.tags && file.tags.length > 0) infoRows.push(m('.preview-info-row', { key: 'tags' }, [ m('span.label', 'Tags'), m('span.value', file.tags.join(', ')) ]));
            return m('.preview-panel.open', [
                m('.preview-header', [ m('span', 'Preview'), m('.preview-close', { onclick: () => { state.previewFile = null; const pp = document.querySelector('.preview-panel'); if (pp) pp.classList.remove('open'); } }, m('i', { class: 'fa-solid fa-xmark' })) ]),
                m('.preview-body', [
                    m('.preview-icon-area', { key: 'icon' }, [ m('i', { class: getFileIcon(file.type) + ' ft-' + cat }) ]),
                    m('div', { key: 'name', style: 'font-weight:600; font-size:14px; margin-bottom:12px; word-break:break-word; line-height:1.4;' }, file.name),
                    infoRows,
                    content ? m('div', { key: 'content-preview' }, [ m('div', { style: 'font-size: 11px; font-weight: 600; color: var(--text-muted); margin-top: 12px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;' }, 'Content Preview'), m('.preview-content-area', content) ]) : null,
                    file.type === 'folder' ? m('div', { key: 'folder-hint', style: 'margin-top:12px; padding:10px; background:var(--bg-surface); border-radius:6px; font-size:12px; color:var(--text-secondary); text-align:center;' }, 'Double-click to open folder') : null,
                ]),
            ]);
        }
    };

    const StatusBar = {
        view() {
            const tab = getActiveTab(); const panel = tab ? getActivePanel(tab) : null;
            const fileCount = panel ? panel.files.length : 0; const selectedCount = panel && panel.selectedId ? 1 : 0;
            const totalSize = panel ? panel.files.reduce((s, f) => s + (f.size || 0), 0) : 0;
            const currentView = viewConfigs[state.viewMode]; const currentSplit = splitConfigs[state.splitMode];
            return m('.status-bar', [
                m('.status-left', [ m('span', { key: 'count' }, fileCount + ' items'), selectedCount > 0 ? m('span', { key: 'selected' }, selectedCount + ' selected') : null, m('span', { key: 'size' }, 'Total: ' + formatSize(totalSize)) ]),
                m('.status-right', [ m('span', { key: 'db' }, [ m('span.status-dot'), 'Dexie.js Active' ]), m('span', { key: 'mode' }, currentSplit.label + ' / ' + currentView.label) ]),
            ]);
        }
    };

    /* FIX: Build panel children as a flat array where EVERY element has a key, no nested arrays */
    const MainLayout = {
        view() {
            const tab = getActiveTab();
            if (!tab || !state.dataReady) return m('.main-layout', { style: 'display:flex; align-items:center; justify-content:center;' }, m('.empty-state', [ m('i', { class: 'fa-solid fa-spinner fa-spin', style: 'font-size:24px;' }), m('span', 'Loading files...') ]));

            const panelChildren = [];
            tab.panels.forEach((panel, idx) => {
                if (idx > 0) panelChildren.push(m('.split-handle', { key: 'handle-' + idx, onmousedown: startResize }));
                panelChildren.push(m(FilePanel, { key: 'panel-' + idx, panel: panel, panelIdx: idx, isActive: (tab._activePanelIdx || 0) === idx }));
            });

            return m('.main-layout', [
                m(Sidebar, { key: 'sidebar' }),
                m('.file-panels-container', { key: 'panels-container' }, panelChildren),
                m(PreviewPanel, { key: 'preview' }),
            ]);
        }
    };

    let resizing = false, resizeStartX = 0, resizeStartWidths = [], resizePanelIndices = [];
    function startResize(e) { resizing = true; resizeStartX = e.clientX; const handle = e.target.closest('.split-handle'); if (!handle) return; const container = handle.parentElement; const allPanels = Array.from(container.querySelectorAll('.file-panel')); const allHandles = Array.from(container.querySelectorAll('.split-handle')); const handleIdx = allHandles.indexOf(handle); resizePanelIndices = [handleIdx, handleIdx + 1]; resizeStartWidths = resizePanelIndices.map(i => allPanels[i].offsetWidth); document.addEventListener('mousemove', onResize); document.addEventListener('mouseup', stopResize); document.body.style.cursor = 'col-resize'; e.preventDefault(); }
    function onResize(e) { if (!resizing) return; const dx = e.clientX - resizeStartX; const container = document.querySelector('.file-panels-container'); const allPanels = Array.from(container.querySelectorAll('.file-panel')); const allHandles = Array.from(container.querySelectorAll('.split-handle')); const totalHandleWidth = allHandles.reduce((s, h) => s + h.offsetWidth, 0); const totalPanelWidth = container.offsetWidth - totalHandleWidth; if (resizePanelIndices.length === 2) { const leftIdx = resizePanelIndices[0]; const rightIdx = resizePanelIndices[1]; const minW = 150; const newLeft = Math.max(minW, Math.min(totalPanelWidth - minW, resizeStartWidths[0] + dx)); const newRight = totalPanelWidth - newLeft; allPanels[leftIdx].style.flex = 'none'; allPanels[leftIdx].style.width = newLeft + 'px'; allPanels[rightIdx].style.flex = 'none'; allPanels[rightIdx].style.width = newRight + 'px'; } }
    function stopResize() { resizing = false; document.removeEventListener('mousemove', onResize); document.removeEventListener('mouseup', stopResize); document.body.style.cursor = ''; }

    document.addEventListener('click', () => { if (state.viewMenuOpen) { state.viewMenuOpen = false; m.redraw(); } });

    const App = {
        oninit() { seedDatabase().then(() => { createTab(0); return initActiveTab(); }).then(() => { state.dataReady = true; m.redraw(); }); },
        view() { return m('div', { style: 'height:100vh; display:flex; flex-direction:column;' }, [ m(TabBar, { key: 'tabbar' }), m(Toolbar, { key: 'toolbar' }), m(MainLayout, { key: 'mainlayout' }), m(StatusBar, { key: 'statusbar' }) ]); }
    };

    m.mount(document.getElementById('app'), App);
    </script>
</body>
</html>
